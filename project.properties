# Sandbox specific parameters
#default.env.alias=THF_DEV2

# === TriggerHelperFramework Automation Configuration ===
# Edit the values below to match your Salesforce environment and preferences.

# Alias of your Dev Hub org (used to create scratch orgs)
DEV_HUB_ALIAS=DEVHUB

# Alias for the scratch org created during the automation
SCRATCH_ALIAS=THF_DEV2

# Path to your scratch org definition file (relative to script location)
SCRATCH_DEF_FILE=config/project-scratch-def.json

# Package alias for Nebula Logger dependency (must match sfdx-project.json alias)
NEBULA_ALIAS=NebulaLogger@4.13.0

# Duration (in days) for scratch org lifetime before it expires
SCRATCH_DURATION=28

# -----------------------------------------------
# Notes:
# - DEV_HUB_ALIAS and SCRATCH_ALIAS are just friendly names you assign.
# - SCRATCH_DEF_FILE should point to a valid scratch org definition JSON file.
# - NEBULA_ALIAS must exactly match a package alias in your sfdx-project.json.
# - SCRATCH_DURATION can be set between 1 and 30 days depending on your needs.

